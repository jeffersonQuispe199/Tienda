<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - NeoLed 2026</title>
    <link rel="stylesheet" href="login.css">
    <!-- Fuente moderna e Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fondo Interactivo de Partículas Canvas -->
    <canvas id="canvasParticulas"></canvas>

    <!-- Contenedor Principal Glassmorphic -->
    <div class="login-wrapper">
        <div class="tarjeta-login">
            
            <!-- Encabezado con Animación LED 3D -->
            <div class="login-header">
                <div class="logo-led-glow">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="led-3d-texto">Acceso Sistema Viveres Dario</h1>
                <p class="subtitulo">Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Formulario de Acceso -->
            <form id="loginForm" autocomplete="off" onsubmit="event.preventDefault();">
                
                <!-- Campo Usuario -->
                <div class="grupo-input">
                    <label for="inputUsuario">Usuario / Correo</label>
                    <div class="caja-input">
                        <i class="fa-solid fa-user icono-input"></i>
                        <input type="text" id="inputUsuario" placeholder="Ej. admin" required>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="grupo-input">
                    <label for="inputClave">Contraseña</label>
                    <div class="caja-input">
                        <i class="fa-solid fa-lock icono-input"></i>
                        <input type="password" id="inputClave" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye icono-password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <!-- Opciones secundarias -->
                <div class="opciones-login">
                    <label class="check-container">
                        <input type="checkbox" id="recordarme">
                        <span class="custom-checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de Inicio con Animación LED Neón 3D en Movimiento -->
                <button type="submit" id="btnIngresar" class="btn-led-3d">
                    <span class="led-border-glow"></span>
                    <span class="btn-contenido">
                        <span id="btnTexto">INICIAR SESIÓN</span>
                        <i class="fa-solid fa-arrow-right-long icono-btn"></i>
                        <span id="btnSpinner" class="spinner oculto"></span>
                    </span>
                </button>

            </form>

            <!-- Mensajes de Feedback -->
            <div id="mensajeFeedback" class="mensaje-alerta oculto"></div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
